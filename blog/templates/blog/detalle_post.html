<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ post.titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <a href="{% url 'lista_posts' %}" class="btn btn-secondary mb-3">&larr; Volver al Blog</a>
    
    <article class="card p-4 shadow-sm mb-5">
        <h1 class="fw-bold">{{ post.titulo }}</h1>
        {% if post.subtitulo %}
            <h4 class="text-muted mb-3">{{ post.subtitulo }}</h4>
        {% endif %}
        <p class="text-muted border-bottom pb-2">
            Publicado por <strong>{{ post.autor.username }}</strong> el {{ post.fecha_creacion|date:"d/m/Y H:i" }}
        </p>

        {% if post.imagen %}
            <div class="my-3 text-center">
                <img src="{{ post.imagen.url }}" class="img-fluid rounded" style="max-height: 400px;" alt="{{ post.titulo }}">
            </div>
        {% endif %}

        <div class="mt-3 fs-5" style="line-height: 1.8;">
            {{ post.cuerpo|linebreaks }}
        </div>
    </article>
</body>
</html>
