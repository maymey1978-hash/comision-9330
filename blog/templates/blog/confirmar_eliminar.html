<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Entrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm border-danger">
        <h3 class="text-danger mb-3">¿Confirmar eliminación?</h3>
        <p>¿Estás segura de que querés eliminar la publicación <strong>"{{ post.titulo }}"</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'detalle_post' post.pk %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Eliminar Definitivamente</button>
            </div>
        </form>
    </div>
</body>
</html>
