<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Nueva Entrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4" style="max-width: 600px;">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-4">Crear Nueva Entrada de Blog</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" name="titulo" required>
            </div>
            <div class="mb-3">
                <label for="subtitulo" class="form-label">Subtítulo (Opcional)</label>
                <input type="text" class="form-control" id="subtitulo" name="subtitulo">
            </div>
            <div class="mb-3">
                <label for="cuerpo" class="form-label">Contenido / Cuerpo</label>
                <textarea class="form-control" id="cuerpo" name="cuerpo" rows="5" required></textarea>
            </div>
            <div class="mb-3">
                <label for="imagen" class="form-label">Imagen (Opcional)</label>
                <input type="file" class="form-control" id="imagen" name="imagen">
            </div>
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'lista_posts' %}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Guardar Entrada</button>
            </div>
        </form>
    </div>
</body>
</html>
